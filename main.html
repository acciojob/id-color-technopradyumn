<!DOCTYPE html>
<html lang="en">

<head>
  <title>Inline CSS Headings</title>
</head>
<style>
  #yellow {
    background-color: yellow;
    border: 1px solid green;
  }

  #red {
    background-color: red;
    border: 1px solid black;
  }

  #green {
    background-color: green;
    border: 1px solid yellow;
  }
</style>

<body>
  <p id="yellow">Yellow</p>
  <p id="red">Red</p>
  <p id="green">Green</p>
</body>

</html>
